name: agave-fuzz-debug
on:
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang
          rustup toolchain install nightly
          cargo install cargo-fuzz

      - name: Build system process_instruction fuzz target
        working-directory: fuzz
        run: cargo +nightly fuzz build fuzz_system_process_instruction 2>&1 | tee /tmp/build_system_fuzz.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-check-results
          path: /tmp/build_system_fuzz.log
          if-no-files-found: warn
