name: agave-fuzz-debug
on:
  workflow_dispatch:

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang
          cargo install cargo-mutants

      - name: List mutants (fast, no build)
        run: cargo mutants --list -p solana-system-program 2>&1 | tee /tmp/mutants_list.log

      - name: Run mutation testing (time-capped)
        run: |
          timeout 4500 cargo mutants -p solana-system-program --features agave-unstable-api 2>&1 | tee /tmp/mutants_run.log || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-results
          path: |
            /tmp/mutants_list.log
            /tmp/mutants_run.log
            mutants.out/
          if-no-files-found: warn
