name: agave-fuzz-debug
on:
  workflow_dispatch:

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit 2>&1 | tee /tmp/audit.log || true

      - name: Run clippy on ledger crate (pedantic)
        working-directory: ledger
        run: cargo clippy --no-deps --features agave-unstable-api -- -W clippy::pedantic 2>&1 | tee /tmp/clippy_ledger.log || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-results
          path: |
            /tmp/audit.log
            /tmp/clippy_ledger.log
          if-no-files-found: warn
