name: agave-fuzz-debug
on:
  workflow_dispatch:

jobs:
  fuzz-system:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang
          rustup toolchain install nightly
          cargo install cargo-fuzz

      - name: Build system process_instruction fuzz target
        working-directory: fuzz
        run: cargo +nightly fuzz build fuzz_system_process_instruction 2>&1 | tee /tmp/build_system_fuzz.log

      - name: Run system process_instruction fuzzer
        working-directory: fuzz
        run: |
          timeout 4000 cargo +nightly fuzz run fuzz_system_process_instruction -j 4 -- -jobs=4 -workers=4 -max_total_time=3900 2>&1 | tee /tmp/fuzzrun_system.log || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-results-system
          path: |
            /tmp/build_system_fuzz.log
            /tmp/fuzzrun_system.log
            fuzz/artifacts/
          if-no-files-found: warn
