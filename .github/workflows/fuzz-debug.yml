name: agave-fuzz-debug
on:
  workflow_dispatch:

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang
          rustup component add clippy
          cargo install cargo-audit
          cargo install cargo-geiger
          python3 -m pip install --break-system-packages semgrep

      - name: cargo audit
        run: cargo audit 2>&1 | tee /tmp/audit.log || true

      - name: clippy on ledger (pedantic)
        working-directory: ledger
        run: cargo clippy --no-deps --features agave-unstable-api -- -W clippy::pedantic 2>&1 | tee /tmp/clippy_ledger.log || true

      - name: clippy on turbine (pedantic)
        working-directory: turbine
        run: cargo clippy --no-deps --features agave-unstable-api -- -W clippy::pedantic 2>&1 | tee /tmp/clippy_turbine.log || true

      - name: cargo-geiger on ledger (unsafe census)
        working-directory: ledger
        run: cargo geiger --features agave-unstable-api 2>&1 | tee /tmp/geiger_ledger.log || echo "geiger failed, see fallback grep below" >> /tmp/geiger_ledger.log

      - name: fallback manual unsafe grep (ledger + turbine + core/window_service.rs)
        run: |
          echo "=== unsafe blocks in ledger/src ===" > /tmp/unsafe_grep.log
          grep -rn "unsafe " ledger/src --include="*.rs" >> /tmp/unsafe_grep.log || true
          echo "=== unsafe blocks in turbine/src ===" >> /tmp/unsafe_grep.log
          grep -rn "unsafe " turbine/src --include="*.rs" >> /tmp/unsafe_grep.log || true
          echo "=== unsafe blocks in core/src/window_service.rs ===" >> /tmp/unsafe_grep.log
          grep -n "unsafe " core/src/window_service.rs >> /tmp/unsafe_grep.log || true

      - name: semgrep (rust + security-audit rulesets)
        run: |
          semgrep --config p/rust --config p/security-audit ledger/src turbine/src core/src/window_service.rs 2>&1 | tee /tmp/semgrep.log || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-results
          path: |
            /tmp/audit.log
            /tmp/clippy_ledger.log
            /tmp/clippy_turbine.log
            /tmp/geiger_ledger.log
            /tmp/unsafe_grep.log
            /tmp/semgrep.log
          if-no-files-found: warn
